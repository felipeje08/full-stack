<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastrar Carro</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastrar Carro</h1>

        <form
            action="/cadastrar_carro"
            method="POST"
        >

            <label>Marca:</label>

            <input
                type="text"
                name="marca"
                required
            >

            <label>Modelo:</label>

            <input
                type="text"
                name="modelo"
                required
            >

            <label>Ano:</label>

            <input
                type="number"
                name="ano"
                required
            >

            <label>Quantidade:</label>

            <input
                type="number"
                name="qtde"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

    </div>

</body>
</html>
