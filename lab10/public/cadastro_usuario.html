<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastro Usuário</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastrar Usuário</h1>

        <form
            action="/cadastrar_usuario"
            method="POST"
        >

            <label>Nome:</label>

            <input
                type="text"
                name="nome"
                required
            >

            <label>Login:</label>

            <input
                type="text"
                name="login"
                required
            >

            <label>Senha:</label>

            <input
                type="password"
                name="senha"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <br>

        <a href="/login_usuario">
            Fazer Login
        </a>

    </div>

</body>
</html>
