<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form action="/logar_usuario" method="POST">

            <input
                type="text"
                name="login"
                placeholder="Digite seu login"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <br>

        <a href="/cadastra">
            Não possui conta? Cadastre-se
        </a>

    </div>

</body>
</html>
