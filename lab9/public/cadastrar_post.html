<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastrar Post</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Criar Post</h1>

        <form
            action="/cadastrar_post"
            method="POST"
        >

            <label>
                Título:
            </label>

            <input
                type="text"
                name="titulo"
                required
            >

            <label>
                Resumo:
            </label>

            <input
                type="text"
                name="resumo"
                required
            >

            <label>
                Conteúdo:
            </label>

            <textarea
                name="conteudo"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Enviar
            </button>

        </form>

    </div>

</body>
</html>
