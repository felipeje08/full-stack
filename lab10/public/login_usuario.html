<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form
            action="/logar_usuario"
            method="POST"
        >

            <label>Login:</label>

            <input
                type="text"
                name="login"
                required
            >

            <label>Senha:</label>

            <input
                type="password"
                name="senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <br>

        <a href="/cadastro_usuario">
            Criar Conta
        </a>

    </div>

</body>
</html>
