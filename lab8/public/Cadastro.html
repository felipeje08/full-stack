<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Usuário</h1>

        <form action="/cadastrar_usuario" method="POST">

            <input
                type="text"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <input
                type="text"
                name="login"
                placeholder="Digite seu login"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

    </div>

</body>
</html>
